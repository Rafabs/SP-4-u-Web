
name: Deploy to GitHub Pages

# Impede que uma nova execução cancele uma publicação em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches: [main]

  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch ARTESP status
        continue-on-error: false
        run: node scripts/fetch-status.mjs
        env:
          CCM_API: ${{ secrets.CCM_API }}

      - name: Fetch SPTrans data
        continue-on-error: false
        run: node scripts/fetch-olhovivo.mjs
        env:
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}

      - name: Build Astro
        run: npm run build
        env:
          PUBLIC_AQI_API_KEY: ${{ secrets.PUBLIC_AQI_API_KEY }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
