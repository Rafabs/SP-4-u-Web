name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  # Roda sempre — só atualiza o JSON
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-status.mjs
      - name: Commit status atualizado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data/status-linhas.json public/data/status-manifest.json
          git diff --staged --quiet || git commit -m "chore: atualiza status das linhas"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Roda só no push — faz o build e deploy completo
  build-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: node scripts/fetch-status.mjs
      - run: npm run build
        env:
          PUBLIC_AQI_API_KEY: ${{ secrets.PUBLIC_AQI_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4